name: test
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/guggero/goformat/cmd/goformat@v0.0.0-20260905140207-73f0d3826255
      - run: make fmt-check test-race build
      - run: go vet ./...
      - run: go test -tags='wavewalletrpc swapruntime' ./itest
      - run: docker build -t wl-regtest-server:ci .
